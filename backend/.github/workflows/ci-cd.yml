name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Syntax Check
        run: |
          node --check bin/www
          node --check bin/worker

  deploy:
    name: Deploy to VPS
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/role-chat-game/backend
            git pull --ff-only origin main
            npm ci
            npx prisma generate
            pg_dump "$DATABASE_URL" --no-owner --no-acl -Fc > "/opt/backups/lunaria-$(date +%Y%m%d-%H%M%S).dump" || echo "WARN: backup falhou"
            npx prisma migrate deploy
            systemctl restart lunaria-backend
            systemctl restart lunaria-worker || true
            sleep 3
            curl -sf http://localhost:3001/health || echo "WARN: healthcheck falhou"
