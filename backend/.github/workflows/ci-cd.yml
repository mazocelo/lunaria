name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Syntax Check
        run: |
          node --check bin/www
          node --check bin/worker

  deploy:
    name: Deploy to VPS
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/role-chat-game/backend

            # Preflight checks
            pg_isready -d "$DATABASE_URL" -t 5 || { echo "ERROR: DB inacessivel"; exit 1; }
            redis-cli -u "$UPSTASH_REDIS_URL" ping 2>/dev/null || echo "WARN: Redis check indisponivel (continuando)"

            # Deploy
            git pull --ff-only origin main
            npm ci
            npx prisma generate

            # Backup
            BACKUP_FILE="/opt/backups/lunaria-$(date +%Y%m%d-%H%M%S).dump"
            mkdir -p /opt/backups
            pg_dump "$DATABASE_URL" --no-owner --no-acl -Fc > "$BACKUP_FILE" || { echo "ERROR: backup falhou"; exit 1; }

            # Migrate + Restart
            npx prisma migrate deploy
            systemctl restart lunaria-backend
            systemctl restart lunaria-worker || true
            sleep 5

            # Healthcheck com rollback
            if ! curl -sf http://localhost:3001/health | grep -q '"status":"ok"'; then
              echo "ERROR: healthcheck falhou — iniciando rollback"
              LATEST_BACKUP=$(ls -t /opt/backups/lunaria-*.dump 2>/dev/null | head -1)
              if [ -n "$LATEST_BACKUP" ]; then
                pg_restore -d "$DATABASE_URL" --clean --if-exists --no-owner "$LATEST_BACKUP" || true
              fi
              git checkout HEAD~1 -- .
              npm ci
              npx prisma generate
              systemctl restart lunaria-backend
              systemctl restart lunaria-worker || true
              echo "Rollback concluido"
              exit 1
            fi
            echo "Deploy OK"
